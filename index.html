<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b0f0d">
  <title>Undying Earth</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <canvas id="game" aria-label="Undying Earth game screen"></canvas>
  <button id="fs-btn" type="button" aria-label="Toggle fullscreen" hidden>&#x26F6;</button>

  <div id="start" class="overlay">
    <div>
      <h1>Undying Earth</h1>
      <button id="start-btn" type="button">Tap to play</button>
      <p id="hint"></p>
    </div>
  </div>

  <div id="rotate" class="overlay" hidden>
    <div>Rotate your device to landscape</div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
